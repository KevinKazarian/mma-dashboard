<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Kevin & Justin MMA</title>
<style>
/* Layout: printed gym sheet. One light column, white cards, big type; prescriptions bold, explanations plain. */
:root{
  --bg:#f5f4f0; --card:#ffffff; --fg:#141414; --muted:#4d4d4d; --line:#d9d7d0; --soft:#efeee9;
  --accent:#141414; --warn:#8a4b00; --warn-bg:#fff3e0; --ok:#1f6b3a;
  --kevin:#c0322a; --justin:#1f5fb4;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;margin:0}
button{font-family:var(--font);color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.wrap{max-width:38rem;margin:0 auto;padding-inline:16px;padding-block:.25rem 2.5rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.4rem;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;flex:1;min-width:0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.45rem .45rem;font-size:.85rem;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;min-width:2.2rem;min-height:2.2rem;font-size:.9rem;font-weight:700}
h1{font-size:1.4rem;line-height:1.15;margin:0}
h2{font-size:1.3rem;line-height:1.2;margin:0}
h3{font-size:1.15rem;line-height:1.25;margin:0}
p{margin:0}
.note{color:var(--muted);font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:.8rem}
/* compact selectors */
.picks{display:flex;flex-direction:column;gap:.3rem;padding:.45rem .55rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
.prow{display:grid;grid-template-columns:3.6rem 1fr;align-items:center;gap:.4rem}
.prow .lab{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-width:0;min-height:2.1rem;padding:0 .1rem;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:.74rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.linkbtn{background:none;border:0;padding:.1rem 0;color:var(--fg);text-decoration:underline;font-size:.8rem;font-weight:700;align-self:flex-start}
.chip{display:inline-block;font-weight:700;font-size:.7rem;padding:.08rem .45rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.next{color:#fff;background:var(--fg);border-color:var(--fg)}
/* the sheet */
.head{display:flex;flex-direction:column;gap:.1rem;padding-top:.5rem}
.head .meta{color:var(--muted);font-size:.85rem}
.blk{display:flex;flex-direction:column;gap:.5rem;padding-top:.6rem}
.bh{display:flex;align-items:baseline;gap:.5rem;border-bottom:2px solid var(--fg);padding-bottom:.15rem}
.bh h2{flex:1;text-transform:uppercase;letter-spacing:.01em}
.bmin{font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seq{background:var(--soft);border-radius:8px;padding:.45rem .65rem;font-size:.95rem}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;display:flex;flex-direction:column;gap:.3rem;break-inside:avoid}
.rx{font-weight:700}
.list{margin:.1rem 0;padding-left:1.15rem;display:flex;flex-direction:column;gap:.1rem}
.list b{font-weight:700}
.plain{font-weight:400}
.coach{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:.3rem .5rem;font-size:.85rem;font-weight:700}
details.instr{border-top:1px solid var(--line);margin-top:.2rem;padding-top:.25rem}
details.instr summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted);text-decoration:underline;list-style:none;padding:.15rem 0}
details.instr summary::-webkit-details-marker{display:none}
details.instr[open] summary{margin-bottom:.35rem}
details.instr .in{display:flex;flex-direction:column;gap:.5rem;font-size:.9rem}
details.instr h4{margin:.2rem 0 0;font-size:.95rem}
.foot{padding-top:.8rem;display:flex;flex-direction:column;gap:.3rem}
/* other tabs */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.name{display:inline-block;font-weight:700;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:.05rem .4rem;border-radius:5px;color:#fff}
.name.kevin{background:var(--kevin)} .name.justin{background:var(--justin)}
.rowbtn{display:flex;justify-content:space-between;gap:.6rem;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:.5rem 0;text-align:left;font-size:.95rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.35rem .3rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
.empty{color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
details.box summary{cursor:pointer;font-weight:700}
/* overlay menu pages */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.overlay .wrap{padding-block:.5rem 3rem}
.menu-item{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:2.6rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 .8rem;font-size:.95rem;font-weight:700;text-align:left}
@media print{
  :root{--bg:#fff}
  body{background:#fff}
  .top,.picks,.noprint,details.instr{display:none!important}
  .wrap{max-width:none;padding:0}
  .ex{border-color:#bbb}
  .blk{break-inside:auto}
  .bh{break-after:avoid}
}
</style>

<script id="data" type="application/json">{"schema_version":3,"updated":"2026-10-27","system":{"name":"Kevin & Justin MMA","schedule":"Tuesday, Wednesday, Thursday - 75 minutes","priorities":["Punching and kicking power","Agility","Speed","Ground movement","Strength"],"notes":"Endurance supports the priorities. Three days in a row: Tuesday is the heavy day, Wednesday shifts the load to the upper body and the ground, Thursday is low-volume and fast."},"athletes":[{"id":"kevin","name":"Kevin","age":27,"bodyweight_lb":195,"experience":"About 10 years of MMA, returning after reduced training. Stronger in striking and in defending takedowns and submissions.","goals":"Expand ground skills and submission combinations.","limitations":"None reported","corner":"red"},{"id":"justin","name":"Justin","age":42,"bodyweight_lb":170,"experience":"Newer to MMA. Athletic.","goals":"Build fundamentals in all ranges.","limitations":"None reported","corner":"blue"}],"readiness":{"how":"Before the warm-up, each person rates sleep, soreness (5 = no soreness) and energy from 1 to 5, and says whether anything hurts. Add the three numbers.","bands":[{"range":"11-15","label":"Go","action":"Train as written."},{"range":"8-10","label":"Trim","action":"Do all technique, speed and power. Skip the last set of each strength exercise. Keep conditioning effort at 7 out of 10."},{"range":"3-7, or any pain","label":"Protect","action":"Technique at the cooperative level only. Skip jumps, sprints, heavy sets and conditioning; do 10 min of easy mobility instead. Describe the pain in the feedback."}]},"rules":{"strength":{"title":"Strength","rest":"About 2-3 min between sets of the same lift (the station rotation gives you this).","rule":"Stop each set with the good reps left that the card says. Next week, add the smallest weight step (trap bar 5-10 lb, dumbbells 5 lb) only if every set was clean with those reps left and readiness was 8 or more. If a set felt harder, keep the weight. If reps were missed, drop 5-10%."},"power":{"title":"Explosive power","rest":"45-90 s. Power is about the best rep, not fatigue.","rule":"Full effort every rep. End a set if a rep is clearly slower or shorter than the first. Sets stay the same in Weeks 1-3. Add 1 kg to the ball only if every throw stayed fast."},"agility":{"title":"Agility","rest":"25 s between 20 s drills.","rule":"Gets harder by complexity, not more work: Week 1 learn, Week 2 faster, Week 3 partner calls the direction, Week 4 react to the partner."},"speed":{"title":"Speed and reaction","rest":"About 45 s: your partner's turn plus walking back.","rule":"Every rep at full speed. Stop when you slow down noticeably."},"conditioning":{"title":"Conditioning","rest":"Set by the interval timer.","rule":"Next week's work time goes up only if this week's effort was 8/10 or less and your strikes were still sharp in the last round."},"technique":{"title":"Technique","rest":"Switch roles between sets; your partner's turn is your rest.","rule":"Move to the next level of resistance when the goal is met in 2 sessions in a row. Anything marked COACH CHECK stays at the cooperative level until a coach has watched it."}},"load_method":{"title":"Finding your weights (Week 1)","steps":["Start light. Do the target reps.","Ask: how many more good reps could I have done? If 5 or more, add a clear step (trap bar 20-40 lb, dumbbells 5-10 lb) and go again.","Stop adding when a set ends with 3 good reps left. That is your weight for the rest of the sets.","Medicine ball: the heaviest ball you can still throw fast for every rep.","Say each weight in the Plaud feedback. It is recorded under Starting weights, separate from results."]},"exercises":{"bj":{"name":"Broad jump","what":"Jump forward as far as you can and land still; builds the leg drive behind kicks and punches.","how":["Swing the arms back, dip, jump forward. Land on both feet, knees soft, and hold still for 2 s. Walk back between jumps.","Every jump at full effort. If a jump is clearly shorter than your first, end the set."],"easier":"Jump straight up and land still.","harder":"Two jumps in a row; hold the second landing.","rule":"power","id":"bj"},"rmb":{"name":"Rotational med-ball throw","what":"Turn the hips and throw the ball hard into the wall, like a cross; builds rotation power.","how":["Stand side-on to the wall, about 1 m away. Ball at the back hip, load the back leg, turn hips then shoulders and throw. Catch, reset, repeat. All reps on one side, then the other.","Choose the heaviest ball you can still throw fast for all 4 reps. If the 4th throw slows down, go lighter."],"easier":"Half-kneeling throw.","harder":"Step in, then throw.","rule":"power","load":true,"id":"rmb","wunit":"kg","wstep":1},"tbdl":{"name":"Trap-bar deadlift","what":"Stand up with the bar, back flat; builds hip drive for takedowns and getting up.","how":["Stand inside the bar, grip the handles, chest up, back flat. Push the floor away until you stand tall. Lower under control.","Week 1: 5 reps light, then add 20-40 lb each set until 5 reps feel like you could do exactly 3 more. Use that weight for your sets."],"easier":"High handles.","harder":"Low handles.","rule":"strength","load":true,"id":"tbdl","wunit":"lb","wstep":10},"dbbp":{"name":"Dumbbell bench press","what":"Press the dumbbells up from your chest; builds pushing strength for frames and punches.","how":["Lie on a flat bench, dumbbells over the chest. Lower until the elbows are just below the bench, then press up."],"easier":"Push-ups with hands on a bench.","harder":"1 s pause at the bottom.","rule":"strength","load":true,"id":"dbbp","wunit":"lb","wstep":5},"dbrow":{"name":"One-arm dumbbell row","what":"Pull the dumbbell to your hip; builds pulling strength for the clinch.","how":["One hand and knee on the bench, back flat. Pull to the hip, pause, lower slowly. One arm, then the other."],"easier":"Both feet on the floor, hand on the bench.","harder":"2 s pause at the top.","rule":"strength","load":true,"id":"dbrow","wunit":"lb","wstep":5},"bagint":{"name":"Heavy-bag intervals","what":"Hard strikes on the bag with full hip turn, then easy movement; builds the engine to keep power late in a round.","how":["Work period: punches and kicks at full power, not just fast. Rest period: bounce lightly and breathe.","Rate your effort out of 10 at the end."],"easier":"Same clock at 7/10 effort.","harder":"Sprawl at the start of every work period.","rule":"conditioning","id":"bagint"},"gtsu":{"name":"Technical stand-up","what":"Get from sitting to fighting stance safely, hands up.","how":["Sit, post one hand behind you, plant the opposite foot. Lift the hips, swing the free leg back underneath, land in stance with hands up. Alternate sides."],"easier":"Slow, hand stays down until the leg is through.","harder":"Partner pushes your chest lightly as you rise.","rule":"agility","id":"gtsu"},"gsprawl":{"name":"Sprawl → hip heist","what":"Drop and kick the legs back, then swing through and come up facing a new direction.","how":["From stance, drop the hips and throw the legs back. Post one hand, swing the opposite leg through, return to stance."],"easier":"Sprawl to the knees, then stand.","harder":"Kevin: add a granby roll after the heist.","rule":"agility","id":"gsprawl"},"gshrimp":{"name":"Hip escape → guard","what":"Push your hips away on your back and bring a knee in; the base of every escape.","how":["On your back, feet planted. Bridge onto one shoulder, push the hips away, bring the knee in. Other side. Travel along the mat."],"easier":"One side at a time, no travel.","harder":"Travel faster, full hip turn each time.","rule":"agility","id":"gshrimp"},"gsit":{"name":"Sit-through","what":"From hands and knees, kick a leg through and sit; keeps you moving when someone is on your side.","how":["On hands and knees, kick one leg through under your body and sit facing the side. Switch sides."],"easier":"Slower switches.","harder":"Hands only touch the mat on the switch.","rule":"agility","id":"gsit"},"pull":{"name":"Strict pull-up","what":"Pull your chin over the bar with no swing; builds grip and pulling strength.","how":["Hands just wider than the shoulders. Full hang, pull until the chin clears the bar, lower all the way. No kicking."],"easier":"Band-assisted, or jump up and lower slowly over 5 s.","harder":"Add weight with a belt.","rule":"strength","load":true,"id":"pull","wunit":"lb","wstep":5,"wnote":"Added weight only (leave empty for bodyweight)."},"hollow":{"name":"Hollow hold","what":"Lie on your back with arms and legs lifted and the low back flat; builds trunk strength.","how":["Press the low back into the mat, lift arms and legs, hold still. Done while your partner does pull-ups."],"easier":"Knees bent, arms by the sides.","harder":"Hold a light plate overhead.","rule":"strength","id":"hollow"},"tgu":{"name":"Turkish get-up","what":"Stand up from the floor holding a kettlebell overhead, then go back down; builds shoulder control and getting up.","how":["Lie down, kettlebell pressed up in one hand. Roll to the elbow, then the hand, lift the hips, sweep the leg under, kneel, stand. Reverse. Eyes on the bell."],"easier":"Half get-up (to the hand only).","harder":"Heavier bell, 2 s pause at each step.","rule":"strength","load":true,"id":"tgu","wunit":"kg","wstep":4},"standesc":{"name":"Stand-up escape rounds","what":"Bottom person fights to stand up while top person tries to keep them down.","how":["Bottom starts sitting with the top person holding from the side. Bottom uses the technical stand-up to get back to stance. Reset each time they stand."],"easier":"Top only keeps hands on, no weight.","harder":"Bottom must stand and throw a jab–cross to finish.","rule":"conditioning","id":"standesc"},"rsprint":{"name":"Reaction sprint, 10 m","what":"React to your partner's signal and sprint 10 m; builds first-step speed.","how":["Start in fighting stance. Partner points left or right or claps; sprint 10 m that way (straight on the clap). Walk back."],"easier":"Clap only, straight ahead.","harder":"Two cues in a row: point, then clap to cut.","rule":"speed","id":"rsprint"},"padflash":{"name":"Pad flash","what":"Hit the pad the moment it appears; builds hand speed and reaction.","how":["Holder hides the pads and flashes one at random. High lead pad = jab, high rear pad = cross, low pad = body shot or kick. 10 s bursts."],"easier":"Holder calls the strike as they flash.","harder":"Holder swings a slow mitt first; slip, then hit.","rule":"speed","id":"padflash"},"shuttle":{"name":"5-10-5 shuttle","what":"Sprint 5 m, turn, 10 m, turn, 5 m; builds change of direction.","how":["Three cones 5 m apart. Start in the middle, sprint to one side, touch the line, sprint to the far cone, touch, sprint back through the middle."],"easier":"Jog the turns.","harder":"Partner calls the first direction.","rule":"agility","id":"shuttle"},"landmine":{"name":"Landmine punch press","what":"Drive the back foot and punch the bar up and out fast; builds punching power.","how":["Bar end in a landmine or corner. Split stance, bar at the shoulder. Drive the back foot, turn the hip, punch the bar up fast. Lower under control. 5 reps one side, then the other.","Moderate weight. Every rep must stay fast."],"easier":"Two hands.","harder":"Add weight only if every rep stays fast.","rule":"power","load":true,"id":"landmine","wunit":"lb","wstep":5},"slrdl":{"name":"Single-leg Romanian deadlift","what":"Hinge forward on one leg with a dumbbell; builds balance and hamstring strength for kicks.","how":["Stand on one leg, dumbbell in the opposite hand. Hinge at the hip, back flat, free leg reaching back, then stand up. One side, then the other."],"easier":"Fingertip on a wall.","harder":"2 s pause at the bottom.","rule":"strength","load":true,"id":"slrdl","wunit":"lb","wstep":5},"neck":{"name":"Neck isometrics","what":"Push your head into your own hand without moving; strengthens the neck.","how":["Hand on the forehead, push the head into it, no movement. Then back of the head, then each side. Light to moderate pressure."],"easier":"10 s, lighter pressure.","harder":"Partner's hand gives the pressure.","rule":"strength","id":"neck"},"shadowint":{"name":"Strike-sprawl-up intervals","what":"Fast shadow combination, sprawl, get up, repeat until the clock says rest.","how":["Throw jab–cross–lead hook fast, sprawl, get up to stance, repeat. Rest period: walk and breathe."],"easier":"Shadow only, no sprawl.","harder":"Technical stand-up after each sprawl.","rule":"conditioning","id":"shadowint"}},"blocks":[{"id":"B1","name":"Block 1 · Foundations of power","start":"2026-10-13","end":"2026-11-05","emphasis":"Rear-hand and rear-leg power, side-control/mount escapes and control, striking into clinch and takedowns.","weeks":[{"week":1,"focus":"Find your weights","note":"Find working weights on every weighted exercise. Baseline tests. Technique is cooperative."},{"week":2,"focus":"Add weight","note":"Weights go up only where Week 1 earned it. Sets stay the same."},{"week":3,"focus":"Add one set","note":"Week 3: strength exercises get one more set at Week 2 weights."},{"week":4,"focus":"Recover and retest","note":"Recovery and test week: same weights, about a third fewer sets. Tests have their own block at the start of each session."}],"dates":{"1":["2026-10-13","2026-10-14","2026-10-15"],"2":["2026-10-20","2026-10-21","2026-10-22"],"3":["2026-10-27","2026-10-28","2026-10-29"],"4":["2026-11-03","2026-11-04","2026-11-05"]},"week4_why":"Weeks 1-3 get harder each week, one change at a time: Week 2 adds weight, Week 3 adds a set. Week 4 is a planned recovery and test week, not a step backward: weights and speed stay the same but there are about a third fewer sets. You need to be fresh for the retests, otherwise they measure fatigue instead of progress, and the lighter week lets Block 2 start from the higher level."}],"benchmarks":[{"id":"broad","name":"Broad jump","quality":"Power","unit":"cm","better":"higher","day":"tue","protocol":"Best of 3 jumps, measured toe line to back of the nearer heel. Stick the landing or the jump does not count. In the power block, before training sets."},{"id":"rotthrow","name":"Rotational med-ball throw","quality":"Power","unit":"m","better":"higher","day":"tue","protocol":"Same ball every test (record the weight). Side-on, throw for distance along the floor/mat; best of 2 per side. Record both sides."},{"id":"tbdl5","name":"Trap-bar deadlift, best set of 5","quality":"Strength","unit":"lb for 5 reps","better":"higher","day":"tue","protocol":"Not a max test. Record the heaviest set of 5 completed and say how many good reps you had left. Compared block to block."},{"id":"groundtest","name":"Ground movement test","quality":"Ground movement","unit":"s","better":"lower","day":"wed","protocol":"From lying on the back: 10 alternating hip escapes along the mat, then a technical stand-up to stance. Partner times. Best of 2."},{"id":"pullmax","name":"Max strict pull-ups","quality":"Strength","unit":"reps","better":"higher","day":"wed","protocol":"First set of the strength block. Full hang to chin over bar, no kipping. Partner counts only clean reps."},{"id":"sprint10","name":"10 m sprint","quality":"Speed","unit":"s","better":"lower","day":"thu","protocol":"Own start from a split stance; partner starts the phone stopwatch on the first movement. Best of 3. Hand timing: compare only your own results."},{"id":"shuttle","name":"5-10-5 shuttle","quality":"Agility","unit":"s","better":"lower","day":"thu","protocol":"Best of 2, one starting to each side. Partner times."},{"id":"jabcross10","name":"10 s jab-cross count","quality":"Speed","unit":"pairs","better":"higher","day":"thu","protocol":"On the heavy bag, 10 s, count only clean jab-cross pairs with the guard back. Best of 2. Done in the pad flash slot."}],"feedback_checklist":["Start: \"MMA workout feedback\", then which session (for example \"Week 3, Workout 2\").","Did you both complete everything as written? If , hard or painful. \"End of feedback.\""],"slots":[{"label":"Feedback","both":{"t":"Record the Plaud note","d":"Name each person"}}],"rest":{"sec":0,"text":"No rest"},"est":240}],"est_sec":240,"start":54}],"minutes":58}},"shared":true}},"loads":{"kevin":{},"justin":{}},"data_notice":"This page is read-only. Nothing you tap or type on it is saved. Results come from your Plaud feedback: after \"Update from Plaud\", Claude records what you reported, adjusts upcoming sessions for both of you, and republishes this page at the same link.","session_status":{"W1-tue":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W1-wed":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W1-thu":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W2-tue":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W2-wed":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W2-thu":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."},"W3-tue":{"status":"completed_no_results","label":"Completed — results unavailable","set_on":"2026-10-27","source":"Kevin, 2026-10-27: performed; detailed results not recorded."}},"next_block":{"status":"not_planned","message":"Next block needs planning. Block 2 is not ready yet. It will be drafted from your results and shown to you for review before it starts."},"la <script>
(function(){
"use strict";
const M = JSON.parse(document.getElementById('data').textContent);
const BL = M.blocks[0], SS = M.sessions_v2, DAYS=['tue','wed','thu'];
const A=['kevin','justin'], NAME={kevin:'Kevin',justin:'Justin'};
const ORDER = Object.values(SS).sort((a,b)=>a.week-b.week || DAYS.indexOf(a.day)-DAYS.indexOf(b.day));
const WNAME={1:'Strength',2:'Ground',3:'Speed'};
const root=document.getElementById('root'), ov=document.getElementById('ov');

function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue; if(k==='class') e.className=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v);} for(const c of kids.flat(9)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); } return e; }
const pretty=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});};
const label=s=>'Week '+s.week+' · Workout '+s.workout;
const secs=t=>String(t).replace(/(\d+(?:\.\d+)?) s\b/g,'$1 seconds');

// ---------- next session: confirmed completion only
function done(s){ return M.workouts.some(w=>w.session_id===s.id) || (M.session_status&&M.session_status[s.id]&&/^completed/.test(M.session_status[s.id].status)); }
function nextS(){ return ORDER.find(s=>!done(s)) || null; }
function statusChip(s){
  if(M.workouts.some(w=>w.session_id===s.id)) return h('span',{class:'chip ok'},'Completed · results recorded');
  if(done(s)) return h('span',{class:'chip ok'},'Completed — results unavailable');
  const n=nextS(); if(n&&n.id===s.id) return h('span',{class:'chip next'},'Next');
  return h('span',{class:'chip'},'Upcoming');
}

let ui={}; try{ ui=JSON.parse(localStorage.getItem('mma4-ui')||'{}'); }catch(e){}
const saveUI=()=>{ try{ localStorage.setItem('mma4-ui',JSON.stringify(ui)); }catch(e){} };
let tab='workout';
let sel=(nextS()||ORDER[ORDER.length-1]).id;
const verOf=s=> s.versions ? ((ui.ver&&ui.ver[s.id]&&s.versions[ui.ver[s.id]])?ui.ver[s.id]:'75') : null;
const planOf=s=> s.versions ? s.versions[verOf(s)] : s;

// ---------- prescription (shown once for both)
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
function partnerLine(c){
  const sl=c.slots||[];
  if(!(sl.length && sl[0].kevin && c.roles && c.roles.a!=='Both')) return null;
  const total=sl.length, each=total/2;
  const works=sl.map(x=> x.kevin.t===c.roles.a ? x.kevin.d : x.justin.d);
  const d=[...new Set(works)];
  let word=(sl[0].label||'turn').split(' ')[0].toLowerCase();
  if(/kevin|justin|rep/.test(word)) word='turn';
  if(!Number.isInteger(each)) return null;
  if(d.length===1 && /^1 \w+$/.test(d[0])) return plural(each,d[0].slice(2))+' each ('+total+' total, taking turns)';
  return plural(each,word)+' each ('+total+' total, taking turns)'+(d.length===1&&d[0]?' · '+d[0]+' per '+word:'');
}
function exLabel(e){ return M.exercises[e.ex] ? M.exercises[e.ex].name : e.ex; }
function rxNodes(c){
  const out=[];
  const isCircuit = c.kind==='together' && c.exercises && c.exercises.length>1;
  if(c.test){
    out.push(h('div',{class:'rx'}, secs(c.dose)+' · each of you'));
    out.push(h('div',{class:'rx'}, 'Rest: '+secs(c.rest.text)));
    if(c.share) out.push(h('div',{class:'rx'}, c.share+' Partner measures.'));
    return out;
  }
  if(isCircuit){
    const per=c.exercises.length, rounds=c.timer? c.timer.rounds/per : null;
    out.push(h('div',{class:'rx'}, (rounds?plural(rounds,'round'):secs(c.dose))+(c.timer?' · '+c.timer.work+' seconds per exercise':'')));
    out.push(h('div',{class:'rx'}, 'Rest: '+(c.timer? c.timer.rest+' seconds after each exercise' : secs(c.rest.text))));
    out.push(h('ul',{class:'list'}, c.exercises.map(e=>h('li',{},exLabel(e)))));
    out.push(h('div',{}, 'Both work together.'));
    return out;
  }
  if(c.kind==='rotation'){
    out.push(h('ul',{class:'list'}, (c.exercises||[]).map(e=>h('li',{}, exLabel(e)+' — ', h('b',{}, secs(e.dose))))));
    out.push(h('div',{class:'rx'}, 'Rest: '+secs(c.rest.text)));
    if(c.share) out.push(h('div',{class:'rx'}, c.share));
    out.push(h('div',{class:'note'},'Each of you does every set listed.'));
    return out;
  }
  if(c.kind==='partner'){
    const pl=partnerLine(c);
    if(pl) out.push(h('div',{class:'rx'}, secs(pl)));
    else if(c.roles && c.roles.a==='Both') out.push(h('div',{class:'rx'}, secs(c.dose.replace(/^(\d+) rounds/,'$1 rounds total'))+' · both work every round'));
    else out.push(h('div',{class:'rx'}, secs(c.dose)));
    out.push(h('div',{class:'rx'}, 'Rest: '+secs(c.rest.text)));
    if(c.roles && c.roles.a!=='Both') out.push(h('div',{}, 'Roles: '+c.roles.a+' and '+c.roles.b.toLowerCase()+'.'));
    if(c.share) out.push(h('div',{class:'rx'}, c.share));
    return out;
  }
  // together, single exercise
  out.push(h('div',{class:'rx'}, secs(c.dose)));
  if(c.exercises && c.exercises.length===1 && c.exercises[0].dose && c.exercises[0].dose!==c.dose) out.push(h('div',{}, secs(c.exercises[0].dose)));
  out.push(h('div',{class:'rx'}, 'Rest: '+secs(c.rest.text)));
  if(c.share) out.push(h('div',{}, c.share+'.'.replace(/\.\.$/,'.')));
  return out;
}
function instrNodes(c,b){
  const parts=[h('p',{},c.what)];
  if(c.roles){
    const r=c.roles;
    parts.push(h('h4',{},'Who does what'));
    if(r.a==='Both') parts.push(h('p',{},r.a_task)); else parts.push(h('p',{}, h('b',{},r.a+': '), r.a_task), h('p',{}, h('b',{},r.b+': '), r.b_task));
    parts.push(h('p',{}, h('b',{},(r.a==='Both'?'Rules':r.b+' may')+': '), r.b_may), h('p',{}, h('b',{},'Reset: '), r.reset), h('p',{}, h('b',{},'Switch: '), r.switch));
  }
  if(c.goal) parts.push(h('h4',{},'Goal'), typeof c.goal==='string'?h('p',{},c.goal):A.map(a=>h('p',{}, h('b',{},NAME[a]+': '), c.goal[a])));
  if(c.how && c.how.length) parts.push(h('h4',{},'Coaching cues'), c.how.map(t=>h('p',{},t)));
  const exs=[...new Set((c.exercises||[]).map(e=>e.ex).concat(c.ex?[c.ex]:[]))];
  exs.forEach(id=>{ const e=M.exercises[id]; if(!e) return;
    parts.push(h('h4',{},e.name), e.how.map(p=>h('p',{},p)), h('p',{}, h('b',{},'Easier: '), e.easier), h('p',{}, h('b',{},'Harder: '), e.harder),
      e.demo ? h('p',{}, h('a',{href:e.demo.url,target:'_blank',rel:'noopener'}, 'Demonstration: '+e.demo.label)) : null); });
  if(c.test){ const bm=M.benchmarks.find(x=>x.id===c.test); if(bm) parts.push(h('h4',{},'Test method (same all year)'), h('p',{},bm.protocol)); }
  return h('details',{class:'instr'}, h('summary',{},'Instructions'), h('div',{class:'in'},parts));
}

// ---------- render
function render(){
  root.replaceChildren();
  const w=h('div',{class:'wrap'});
  w.append(h('div',{class:'top'},
    h('nav',{class:'tabs','aria-label':'Main'}, [['workout','Workout'],['progress','Progress'],['history','History']].map(([k,l])=>h('button',{'aria-current':tab===k?'page':null,onclick:()=>{tab=k;render();window.scrollTo(0,0);}},l))),
    h('button',{class:'icon-btn','aria-label':'Menu',onclick:()=>openMenu()},'☰')));
  w.append(tab==='workout'?workoutView():tab==='progress'?progressView():historyView());
  root.append(w);
}

function workoutView(){
  const s=SS[sel], plan=planOf(s), n=nextS();
  const v=h('div',{class:'stack'});
  v.append(h('header',{class:'head'},
    h('h1',{},label(s)+' · '+WNAME[s.workout]),
    h('div',{class:'meta'}, s.focus+' · about '+plan.minutes+' min ', statusChip(s))));
  v.append(h('div',{class:'picks'},
    h('div',{class:'prow'}, h('span',{class:'lab'},'Week'), h('div',{class:'seg',role:'group','aria-label':'Week'}, [1,2,3,4].map(wk=>h('button',{'aria-pressed':String(s.week===wk),onclick:()=>{sel='W'+wk+'-'+s.day;render();}},String(wk))))),
    h('div',{class:'prow'}, h('span',{class:'lab'},'Workout'), h('div',{class:'seg',role:'group','aria-label':'Workout'}, [1,2,3].map(wo=>h('button',{'aria-pressed':String(s.workout===wo),onclick:()=>{sel='W'+s.week+'-'+DAYS[wo-1];render();}},wo+' '+WNAME[wo])))),
    s.versions ? h('div',{class:'prow'}, h('span',{class:'lab'},'Length'), h('div',{class:'seg',role:'group','aria-label':'Length'}, ['75','60'].map(k=>h('button',{'aria-pressed':String(verOf(s)===k),onclick:()=>{ui.ver=ui.ver||{};ui.ver[s.id]=k;saveUI();render();}},(k==='75'?'Full ':'Short ')+s.versions[k].minutes+' min')))) : null,
    n && n.id!==s.id ? h('button',{class:'linkbtn',onclick:()=>{sel=n.id;render();}},'Go to next session: '+label(n)) : null));
  if(s.week>=4 || !n) v.append(h('div',{class:'coach noprint'}, M.next_block.message));
  plan.blocks.forEach(b=>{
    const blk=h('section',{class:'blk'});
    blk.append(h('div',{class:'bh'}, h('h2',{},b.n+'. '+b.name), h('span',{class:'bmin'},b.min+' min')));
    if(b.skill) blk.append(h('div',{class:'seq'}, h('b',{},'Sequence: '), b.skill.seq || A.map(a=>NAME[a]+': '+b.skill[a]).join('  ')));
    b.cards.forEach(c=>{
      const ex=h('div',{class:'ex'});
      ex.append(h('h3',{},c.title));
      if(c.kind==='steps') ex.append(h('ul',{class:'list'}, c.steps.map(t=>h('li',{},secs(t)))));
      else {
        rxNodes(c).forEach(x=>ex.append(x));
        if(c.prep) ex.append(h('div',{}, h('b',{},'First: '), secs(c.prep)));
        (c.coach||[]).forEach(f=>ex.append(h('div',{class:'coach'}, 'Coach check'+(f.athlete&&f.athlete!=='Both'?' ('+f.athlete+')':'')+': '+f.item+'.')));
        ex.append(instrNodes(c,b));
      }
      blk.append(ex);
    });
    v.append(blk);
  });
  v.append(h('footer',{class:'foot'},
    h('div',{class:'note'},'After training, one Plaud note: "MMA workout feedback", the session, whether you both did everything as written, Kevin\'s and Justin\'s weights, what felt easy or hard.'),
    h('div',{class:'note'}, 'Program '+M.program_version+' · updated '+pretty(M.updated)+' · '+(M.last_feedback?'last feedback processed '+pretty(M.last_feedback.date)+' ('+M.last_feedback.label+')':'no Plaud feedback processed yet'))));
  return v;
}

// ---------- menu overlay
let scrollY0=0;
function openOverlay(build){
  scrollY0=window.scrollY;
  const w=h('div',{class:'wrap stack'});
  w.append(h('div',{class:'top',style:'border:0'}, h('span',{}), h('button',{class:'icon-btn','aria-label':'Close',onclick:closeOverlay},'✕')));
  build(w);
  w.append(h('button',{class:'menu-item',style:'justify-content:center',onclick:closeOverlay},'Close'));
  ov.replaceChildren(h('div',{class:'overlay',role:'dialog','aria-modal':'true'}, w));
}
function closeOverlay(){ ov.replaceChildren(); window.scrollTo(0,scrollY0); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && ov.firstChild) closeOverlay(); });
function openMenu(){
  openOverlay(w=>{
    w.append(h('h1',{},'Menu'));
    [['Program rules and progression',rulesPage],['Readiness check',readinessPage],['Plaud feedback: what to say',plaudPage],['How this page updates',savingPage],['Export the record',exportPage]]
      .forEach(([l,f])=>w.append(h('button',{class:'menu-item',onclick:()=>{ ov.replaceChildren(); openOverlay(f); }}, l, h('span',{class:'note'},'›'))));
    w.append(h('div',{class:'note'},'Program '+M.program_version+' · updated '+pretty(M.updated)));
  });
}
function rulesPage(w){
  w.append(h('h1',{},'Program rules'));
  w.append(h('div',{class:'card'}, h('h3',{},'One shared workout'), h('p',{},'Kevin and Justin do the same exercises, sets, reps, rest and drills. Only weights and results differ. Feedback changes the plan for both.')));
  w.append(h('div',{class:'card'}, h('h3',{},'The four weeks'), BL.weeks.map(x=>h('p',{}, h('b',{},'Week '+x.week+' · '+x.focus+'. '), x.note)), h('p',{},BL.week4_why)));
  w.append(h('div',{class:'card'}, h('h3',{},'Short version'), h('p',{},'Each upcoming session has a preplanned 60-minute version: the finisher goes first, then only as many optional rounds as needed. Rest stays the same.')));
  w.append(h('div',{class:'card'}, h('h3',{},'Reading the sheet'), h('p',{},'"3 rounds each (6 total, taking turns)": 6 rounds in a row, switching roles every round, so each of you does 3. Stations: each of you does every set listed.')));
  Object.values(M.rules).forEach(r=>w.append(h('div',{class:'card'}, h('h3',{},r.title), h('p',{class:'note'},'Rest: '+r.rest), h('p',{},r.rule))));
}
function readinessPage(w){ w.append(h('h1',{},'Readiness check'), h('p',{},M.readiness.how)); M.readiness.bands.forEach(b=>w.append(h('div',{class:'card'}, h('h3',{},b.label+' · '+b.range), h('p',{},b.action)))); }
function plaudPage(w){ w.append(h('h1',{},'Plaud feedback'), h('p',{class:'note'},'A summary is enough. You do not need to report every set.'), h('ol',{style:'padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem;margin:0'}, M.feedback_checklist.map(x=>h('li',{},x)))); }
function savingPage(w){ w.append(h('h1',{},'How this page updates'), h('div',{class:'card'}, h('p',{},M.data_notice)),
  h('div',{class:'card'}, h('ol',{style:'margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.3rem'}, h('li',{},'Train from this sheet.'), h('li',{},'Record one Plaud note afterwards.'), h('li',{},'Kevin tells Claude "Update from Plaud".'), h('li',{},'Claude records it and republishes this page at the same link. The next session then shows here.')))); }
function exportPage(w){ w.append(h('h1',{},'Export the record'), h('div',{class:'card'}, h('p',{},'The master record is a JSON file in Kevin\'s Claude Project "Kevin & Justin — MMA Development". Ask Claude there to "export the master record", or for a "ChatGPT copy" (plain text).'))); }

// ---------- progress
function lineChart(b){
  const rows=M.benchmark_results.filter(r=>r.benchmark_id===b.id && typeof r.value==='number');
  if(!rows.length) return null;
  const W=320,H=150,P={l:40,r:70,t:12,b:24};
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  const vals=rows.map(r=>r.value); let lo=Math.min(...vals), hi=Math.max(...vals); if(lo===hi){lo-=1;hi+=1;}
  const x=d=>P.l+(dates.length===1?(W-P.l-P.r)/2:(dates.indexOf(d)/(dates.length-1))*(W-P.l-P.r));
  const y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('role','img'); svg.setAttribute('aria-label',b.name+' over time');
  const el=(t,a,txt)=>{const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.append(e); return e;};
